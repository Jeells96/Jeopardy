<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>🎄 Christmas Jeopardy 🎅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎄%3C/text%3E%3C/svg%3E" />
  <!-- SheetJS for the xlsx template + import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <div class="lights" aria-hidden="true"></div>
  <main id="app"><div class="screen center"><div class="snowcard"><h1 class="title">🎄</h1><p>Loading…</p></div></div></main>
  <script type="module" src="./js/app.js"></script>
  <script>
    // Falling snow (purely decorative).
    (function () {
      const layer = document.querySelector('.snow');
      const flakes = ['❄', '❅', '❆', '•', '*'];
      for (let i = 0; i < 40; i++) {
        const f = document.createElement('span');
        f.className = 'flake';
        f.textContent = flakes[Math.floor(Math.random() * flakes.length)];
        f.style.left = Math.random() * 100 + 'vw';
        f.style.fontSize = (Math.random() * 14 + 8) + 'px';
        f.style.animationDuration = (Math.random() * 8 + 6) + 's';
        f.style.animationDelay = (-Math.random() * 14) + 's';
        f.style.opacity = (Math.random() * 0.6 + 0.3).toString();
        layer.appendChild(f);
      }
    })();
  </script>
</body>
</html>

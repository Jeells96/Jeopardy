<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060b2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Christmas Jeopardy — buzz in from your phone!" />
  <title>Christmas Jeopardy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:wght@700&family=Mountains+of+Christmas:wght@700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body data-view="join">
  <div class="snow" aria-hidden="true"></div>
  <div class="sky" aria-hidden="true"></div>
  <div class="hills" aria-hidden="true"></div>
  <div class="string-lights" aria-hidden="true"></div>
  <main id="app"><div class="join"><div class="join-card loading"><div class="spinner"></div></div></div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
  <script>
    // A string of Christmas lights across the top: a drooping wire with a bulb hanging from
    // each dip, glowing and twinkling at their own pace.
    (function () {
      var wire = document.querySelector(".string-lights");
      var colors = ["red", "amber", "green", "blue", "pink"];
      function hang() {
        var gap = window.innerWidth < 600 ? 44 : 64;
        var n = Math.ceil(window.innerWidth / gap) + 1;
        wire.style.setProperty("--gap", gap + "px");
        wire.innerHTML = "";
        for (var i = 0; i < n; i++) {
          var b = document.createElement("span");
          b.className = "bulb " + colors[i % colors.length];
          b.style.left = i * gap + gap / 2 + "px";
          b.style.setProperty("--tilt", (i % 2 ? 9 : -9) + (Math.random() * 6 - 3) + "deg");
          b.style.animationDuration = (1.6 + Math.random() * 2.2).toFixed(2) + "s";
          b.style.animationDelay = (-Math.random() * 4).toFixed(2) + "s";
          wire.appendChild(b);
        }
      }
      hang();
      var t; window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(hang, 200); });
    })();
    // Falling snow (decorative). Fewer flakes on small screens.
    (function () {
      var layer = document.querySelector(".snow");
      var n = window.innerWidth < 600 ? 22 : 45;
      var flakes = ["❄", "❅", "❆", "•"];
      for (var i = 0; i < n; i++) {
        var f = document.createElement("span");
        f.className = "flake";
        f.textContent = flakes[i % flakes.length];
        f.style.left = Math.random() * 100 + "vw";
        f.style.fontSize = Math.random() * 12 + 8 + "px";
        f.style.animationDuration = Math.random() * 10 + 9 + "s";
        f.style.animationDelay = -Math.random() * 18 + "s";
        f.style.opacity = (Math.random() * 0.5 + 0.25).toFixed(2);
        layer.appendChild(f);
      }
    })();
  </script>
</body>
</html>
